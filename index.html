<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101018">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>

      <div class="brand">
        <div class="brand-logo">✳</div>
        <span>JARVIS</span>
      </div>

      <div class="top-actions">
        <span class="online"><i></i> Online</span>
        <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
      </div>
    </header>

    <aside class="sidebar" id="sidebar">
      <button class="new-chat" id="newChat">＋ New Chat</button>
      <div class="side-heading">WORKSPACE</div>
      <button class="side-link" data-tool="Chat">◈ Chat</button>
      <button class="side-link" data-tool="Image">▧ Image Studio</button>
      <button class="side-link" data-tool="Video">▷ Video Studio</button>
      <button class="side-link" data-tool="Music">♫ Music Studio</button>
      <button class="side-link" data-tool="Code">⌘ Coding</button>
      <button class="side-link" data-tool="Apps">▦ App Builder</button>

      <div class="side-heading">RECENT CHATS</div>
      <div id="historyList"></div>
    </aside>

    <main class="main">
      <section class="welcome" id="welcome">

        <div class="orb-wrap">
          <div class="orb">
            <div class="orb-core"></div>
            <div class="orb-ring ring-one"></div>
            <div class="orb-ring ring-two"></div>
          </div>
          <div class="orb-shadow"></div>
        </div>

        <h1>Hello, I’m <span>JARVIS</span></h1>
        <p>How can I help you today?</p>

        <div class="tools-grid">
          <button class="tool-card" data-tool="Chat">
            <b>◈</b><strong>Chat</strong><small>Ask anything</small>
          </button>
          <button class="tool-card" data-tool="Image">
            <b>▧</b><strong>Image</strong><small>Generate & edit</small>
          </button>
          <button class="tool-card" data-tool="Video">
            <b>▷</b><strong>Video</strong><small>Create & edit</small>
          </button>
          <button class="tool-card" data-tool="Music">
            <b>♫</b><strong>Music</strong><small>Compose songs</small>
          </button>
          <button class="tool-card" data-tool="Code">
            <b>⌘</b><strong>Code</strong><small>Write & debug</small>
          </button>
          <button class="tool-card" data-tool="Apps">
            <b>▦</b><strong>Apps</strong><small>Build anything</small>
          </button>
        </div>
      </section>

      <section class="messages" id="chat"></section>

      <section class="composer-area">
        <form class="composer" id="chatForm">
          <button type="button" class="attach-btn" id="attachBtn">＋</button>
          <textarea id="message" rows="1"
            placeholder="Message JARVIS..." required></textarea>
          <button type="button" class="composer-icon" id="voiceInput"
            title="Voice input">🎙</button>
          <button type="submit" class="send-btn" id="sendButton">↑</button>
        </form>

        <button class="voice-chat" id="voiceChat">
          <span class="wave">〰</span>
          <span class="mic">🎙</span>
          <span><strong>Voice Chat</strong><small>Tap to speak</small></span>
          <span class="wave">〰</span>
        </button>

        <div class="footer-note">JARVIS AI · YOUR PERSONAL ASSISTANT</div>
      </section>
    </main>
  </div>

  <div class="overlay" id="overlay"></div>
  <script src="script.js?v=4"></script>
</body>
</html>
