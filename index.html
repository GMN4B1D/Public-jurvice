<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101115">
  <title>JARVIS AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="header">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

    <div class="brand">
      <div class="brand-logo" aria-hidden="true">✳</div>
      <span>JARVIS</span>
    </div>

    <div class="header-right">
      <span class="online"><i></i> Online</span>
      <button class="icon-btn" id="searchBtn" type="button" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="10.8" cy="10.8" r="6.8"/>
          <path d="m16 16 5 5"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="homeScreen">
    <section class="hero">
      <div class="orb-container" aria-hidden="true">
        <div class="orb-glow"></div>
        <div class="orb">
          <div class="orb-light"></div>
          <div class="orb-wave wave1"></div>
          <div class="orb-wave wave2"></div>
          <div class="orb-wave wave3"></div>
        </div>
        <div class="orb-particles"></div>
      </div>

      <h1>Hello, I'm <span>JARVIS</span></h1>
      <p>How can I help you today?</p>
    </section>

    <section class="tools-grid" aria-label="AI Capabilities">
      <button class="tool-card" type="button" data-prompt="Help me with anything I want to ask.">
        <span class="tool-icon blue">✳</span>
        <span class="tool-title">Chat</span>
        <span class="tool-desc">Ask anything</span>
      </button>

      <button class="tool-card" type="button" data-prompt="Help me generate or edit an image.">
        <span class="tool-icon purple">▧</span>
        <span class="tool-title">Image</span>
        <span class="tool-desc">Generate &amp; edit</span>
      </button>

      <button class="tool-card" type="button" data-prompt="Help me create or edit a video.">
        <span class="tool-icon pink">▷</span>
        <span class="tool-title">Video</span>
        <span class="tool-desc">Create &amp; edit</span>
      </button>

      <button class="tool-card" type="button" data-prompt="Help me compose an original song.">
        <span class="tool-icon orange">♫</span>
        <span class="tool-title">Music</span>
        <span class="tool-desc">Compose songs</span>
      </button>

      <button class="tool-card" type="button" data-prompt="Help me write and debug code.">
        <span class="tool-icon green">&lt;/&gt;</span>
        <span class="tool-title">Code</span>
        <span class="tool-desc">Write &amp; debug</span>
      </button>

      <button class="tool-card" type="button" data-prompt="Help me build a website or application.">
        <span class="tool-icon cyan">▦</span>
        <span class="tool-title">Apps</span>
        <span class="tool-desc">Build anything</span>
      </button>
    </section>
  </main>

  <section class="chat-screen" id="chatScreen" aria-label="Conversation">
    <div class="chat-top">
      <button type="button" id="backHomeBtn">← Home</button>
      <span>New conversation</span>
      <button type="button" id="clearBtn">Clear chat</button>
    </div>
    <div class="messages" id="messages"></div>
  </section>

  <footer class="bottom-area">
    <div class="model-row">
      <label class="model-label" for="provider">AI MODEL</label>
      <select id="provider">
        <option value="openai">ChatGPT</option>
        <option value="grok">Grok</option>
      </select>
    </div>

    <div class="composer">
      <button class="composer-icon" id="attachBtn" type="button" aria-label="Attach file">＋</button>
      <input id="messageInput" type="text" placeholder="Message JARVIS..." autocomplete="off">
      <button class="composer-icon" id="imageBtn" type="button" aria-label="Upload image">▧</button>
      <button class="composer-icon" id="micBtn" type="button" aria-label="Voice input">〰</button>
      <button class="send-btn" id="sendBtn" type="button" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M6 11l6-6 6 6"/>
        </svg>
      </button>
    </div>

    <input type="file" id="fileInput" accept="image/*" hidden>

    <button class="voice-chat" id="voiceBtn" type="button">
      <span class="voice-symbol">〰</span>
      <span><b>Voice Chat</b><small>Tap to speak</small></span>
      <span class="voice-arrow">›</span>
    </button>

    <div class="footer-note">JARVIS AI · Created by GM NABID</div>
    <div class="home-indicator" aria-hidden="true"></div>
  </footer>

</div>
<script src="script.js"></script>
</body>
</html>
